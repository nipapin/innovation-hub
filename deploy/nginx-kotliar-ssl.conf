# Fallback only: separate cert for kotliar.ffworks.pro.
# Prefer expanding the ffworks cert instead:
#   certbot --nginx --expand -d ffworks.pro -d www.ffworks.pro -d kotliar.ffworks.pro
# Use this file only if you keep /etc/letsencrypt/live/kotliar.ffworks.pro/
# (one ssl_certificate per server {}). Paste into sites-available/ffworks
# after the existing listen 443 server, and add kotliar to the :80 server_name.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kotliar.ffworks.pro;

    ssl_certificate /etc/letsencrypt/live/kotliar.ffworks.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotliar.ffworks.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
