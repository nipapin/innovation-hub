# /etc/nginx/sites-available/ffworks
# Reverse proxy for the Next.js app (pm2, port 3000).
# HTTPS is added on top of this by `certbot --nginx`.
#
# kotliar.ffworks.pro — public site for one account (rewritten in proxy.ts).
# DNS: A/AAAA for kotliar.ffworks.pro to this same VPS as ffworks.pro.
# TLS: certbot --nginx -d kotliar.ffworks.pro  (one host, not a wildcard).
# App env: KOTLIAR_SITE_OWNER_ID=<Ivan's user id>

server {
    listen 80;
    listen [::]:80;
    server_name ffworks.pro www.ffworks.pro kotliar.ffworks.pro;

    # Admin media uploads go through /api/admin/upload; large files use
    # presigned S3 uploads directly from the browser, so 100m is plenty.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required by the app: visitor IP tracking, rate limiting,
        # and Google OAuth callback URL detection.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Скачивание папки архивом (/api/storage/v1/archive) отдаёт поток на
        # гигабайты. Отдельных директив ему не нужно: роут присылает
        # X-Accel-Buffering: no, и nginx перестаёт копить ответ в буфере, а
        # таймауты выше считаются между чтениями из приложения, а не на весь
        # ответ (см. docs/reference/07-storage.md §14).
    }
}
